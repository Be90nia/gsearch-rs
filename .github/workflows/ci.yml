name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Test & Lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        rust: [stable]

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "target"

      - name: cargo build --release
        run: cargo build --release

      - name: cargo test (lib + bin, no live_tests)
        # live_tests 需要真 Chrome + profile——只在 Windows 跑
        run: cargo test --lib --bins -- --skip live_tests

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

  benchmark:
    name: Build size check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release
        run: cargo build --release

      - name: Verify binary size < 15MB
        shell: bash
        run: |
          binary=$(ls target/release/gsearch* 2>/dev/null | head -1)
          if [ -z "$binary" ]; then
            echo "Binary not found"
            exit 1
          fi
          size=$(stat -c%s "$binary" 2>/dev/null || stat -f%z "$binary")
          size_mb=$(echo "scale=2; $size / 1024 / 1024" | bc)
          echo "Binary size: ${size_mb} MB"
          if [ $(echo "$size_mb > 15" | bc) -eq 1 ]; then
            echo "ERROR: binary exceeds 15MB limit"
            exit 1
          fi