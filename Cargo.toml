[package]
name = "gsearch"
version = "0.3.0"
edition = "2024"
license = "MIT"

[features]
# M14-2A chaser-stealth：默认关闭。on 时 launch 层启用 transport stealth（CDP 序列补丁）。
# chaser-oxide fork 本体 API 与 chromiumoxide 类型不互通（接入需全库换 CDP 客户端），
# 按竞品扫描 §3 降级为本仓库内实现，不引 fork。
chaser-stealth = []

[dependencies]
chromiumoxide = "0.9"
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
scraper = "0.20"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# M16 SearXNG：chromiumoxide 已拖 reqwest 0.13 进依赖树，这里只开 json（局域网 http 直连，无需 TLS）。
# gsearch-rs-fetch：fetch 子命令要抓公网 https，补开 rustls（0.13 起为 default-tls 本体，纯 Rust 三平台 CI 友好）。
# af9 DDG：曾为 DDG client 补开 native-tls（rustls JA3 被 DDG anomaly 风控识别）；
# khn（2026-10-09）实测 native-tls 也被识别（风控认 UA 串+TLS/头指纹），DDG 传输层已切
# curl 子进程旁路，native-tls 目前无代码消费者——保留 feature 组合不动（Cargo 红线），后续按需清理。
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream", "native-tls"] }
# xih：--markdown 的 html→md 本地转换。turndown.js 移植（表格转 md 表格/标题层级/链接保留），
# 仅依赖 html5ever 族（scraper 已带入同源生态）；维护活跃（0.5.5，2026-07 发版）。
htmd = "0.5"
futures = "0.3"

[dev-dependencies]
# start_paused（tokio 虚拟时钟）仅测试启用；release 构建不含 dev-deps，二进制不受影响。
tokio = { version = "1", features = ["test-util"] }
# 集成测试假服务器统计（已在依赖树，零新增编译）；测试锁无须中毒处理
parking_lot = "0.12"

# q01 版本烧录：build.rs 编译期注入 VERGEN_GIT_DESCRIBE/GIT_SHA（--version 行）。
# vergen 9+ 平台拆分后选 gitcl（走 git CLI，维护最活跃）；仅描述符+sha 两项，构建增量成本可忽略。
[build-dependencies]
vergen-gitcl = "10"

# M18 CI：Release profile 优化（Linux x86_64 release 二进制 16.4MB 撞 15MB 阈值）。
# LTO=fat 比 thin 多压 1-2MB（chromiumoxide_cdp 全 CDP 类型最大受益），build 慢 ~30s 可接受。
# strip=true 移除调试符号。codegen-units=1 让 LTO 跨单元。
# panic=abort 省 unwind tables（gsearch 不依赖 catch_unwind）。
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"
